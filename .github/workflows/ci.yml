name: CI

on:
  push:
  pull_request:

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt -r requirements-dev.txt
      - name: Unit and differential tests
        run: python -m unittest discover -s tests
      - name: Offline release runner
        run: python run_project.py
      - name: Checks do not mutate tracked evidence
        run: git diff --exit-code
