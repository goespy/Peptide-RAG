name: CI

on:
  push:
  pull_request:

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt -r requirements-dev.txt
      - name: Unit and differential tests
        run: python -m unittest discover -s tests
      - name: Frozen example questions match their generator
        run: python scripts/freeze_examples.py --check
      - name: Offline release runner
        run: python run_project.py
      - name: Checks do not mutate tracked evidence
        run: git diff --exit-code
